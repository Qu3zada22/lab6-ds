[project]
name = "lab6-ds"
version = "0.1.0"
description = "Reproducible YouTube participation network analysis"
readme = "README.md"
authors = [
    { name = "ayalaSL", email = "iris@softlogic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "emoji>=2.15.0",
    "es-core-news-sm",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "nltk>=3.10.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "spacy>=3.8.16",
    "wordcloud>=1.9.6",
    "transformers==4.57.3",
    "pysentimiento==0.7.3",
    "torch==2.8.0",
    "reportlab==4.4.4",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "beautifulsoup4==4.15.0",
    "mistune==3.3.4",
]

[project.scripts]
lab6-ds = "lab6_ds:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
